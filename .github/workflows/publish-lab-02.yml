name: publish_lab

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'lab-02/**'
      - '.github/workflows/publish-lab-02.yml'


permissions:
  contents: read
  packages: write


# push twice and the first run is cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      image: ${{ steps.pick.outputs.image }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - id: pick
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # GHCR rejects an uppercase path, and an owner may have capitals
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r lab-02/requirements.txt -r lab-02/requirements-dev.txt
      - run: pytest
        working-directory: lab-02

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: false

  publish:
    needs: [test, build, meta]
    if: needs.meta.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: lab-02
          push: true
          tags: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}
          # the label that ties the image to a commit
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - run: echo "${{ needs.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
