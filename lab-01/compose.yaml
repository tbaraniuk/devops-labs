name: fancy-app

services:
  app:
    build: .
    image: fancy-app
    environment:
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD}@db:5432/shop
      PARTNER_URL: http://partner:8080
      PARTNER_TIMEOUT: "2"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      partner:
        condition: service_started
    networks:
      - app-net
      - backend-net
      - partner-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - backend-net

  partner:
    image: wiremock/wiremock:3.6.0
    command: ["--verbose", "--disable-banner"]
    volumes:
      - ./partner/mappings:/home/wiremock/mappings
    networks:
      - partner-net

volumes:
  pgdata:

networks:
  backend-net:
    internal: true
  partner-net:
    internal: true
  app-net:
